<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Stash — Tidy</title>
  <link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/forms.css"><link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="tabs.css"><link rel="stylesheet" href="tidy.css">
</head>
<body class="panel sky">
  <header id="head"></header>
  <div class="top">
    <form id="searchForm" role="search" novalidate>
      <div class="pill-field has-action"><label class="sr" for="search">Search bookmarks</label>
        <input id="search" type="search" placeholder="Ask your bookmarks…" autocomplete="off">
        <button class="btn icon-round action" type="submit" aria-label="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      </div>
    </form>
    <nav id="tabs"></nav>
  </div>

  <main class="tidy">
    <svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6z" fill="#111"/><path d="M12 1v20M2 11h20" stroke="#A6C3DD" stroke-width="0.5"/></svg>
    <h1 id="h1">Never miss a messy folder</h1>

    <ul id="cats" class="cats"></ul>
    <p id="summary" class="muted" role="status" aria-live="polite"></p>

    <div class="actions">
      <button id="fix" type="button" class="btn lg solid grow">Fix items</button>
      <button id="preview" type="button" class="btn lg outline" aria-pressed="false">Preview</button>
    </div>
    <div class="undo-row"><span id="undoText">You can undo any time.</span><button id="undo" type="button" class="btn sm outline" hidden>Undo last tidy-up</button></div>
  </main>
  <script type="module" src="tidy.js"></script>
</body>
</html>
