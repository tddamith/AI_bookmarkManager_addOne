<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Stash — Sign up</title>
  <link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/forms.css"><link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel lime">
  <header id="head"></header>
  <main class="panel-body">
    <h1 style="max-width: 340px">Ready to tidy your bookmarks?</h1>
    <ul class="perks">
      <li><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#111"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#D4FA1E" stroke-width="2"/></svg>AI files every save for you</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#111"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#D4FA1E" stroke-width="2"/></svg>One-tap tidy-up</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#111"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#D4FA1E" stroke-width="2"/></svg>Free forever, no card needed</li>
    </ul>

    <button id="google" type="button" class="btn lg outline">Sign up with Google</button>
    <div class="or" aria-hidden="true"><span></span>or<span></span></div>

    <form id="form" class="panel-form" novalidate>
      <div class="field"><label for="name">Name —</label><input id="name" type="text" placeholder="Your name" autocomplete="name" required></div>
      <div class="field"><label for="email">Email —</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
      <div class="field"><label for="password">Password —</label><div class="control"><input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required><button type="button" class="icon-btn" data-toggle-password="password"></button></div></div>
      <div class="check" style="align-items:flex-start;line-height:1.45"><input id="terms" type="checkbox" style="margin-top:1px"><label for="terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></label></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button type="submit" class="btn lg solid">Create account</button>
    </form>

    <footer class="panel-foot">Have an account? <a href="login.html">Log in</a></footer>
  </main>
  <script type="module" src="signup.js"></script>
</body>
</html>
