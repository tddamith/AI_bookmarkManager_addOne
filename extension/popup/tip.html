<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Stash — Pin tip</title>
  <link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/forms.css"><link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="onboarding.css">
</head>
<body class="panel tan">
  <header id="head"></header>
  <main class="panel-body onboard">
    <div class="steps" role="img" aria-label="Step 4 of 4"><i class="done"></i><i class="done"></i><i class="done"></i><i class="on"></i></div>
    <h1 style="margin-top:8px">Keep Stash beside every page</h1>

    <div class="mock" aria-hidden="true">
      <div class="mockpage"><i style="width:70%"></i><i style="width:90%"></i><i style="width:80%"></i></div>
      <div class="mockpanel"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="#D4FA1E"/></svg></div>
    </div>

    <ol class="tips">
      <li><span class="num">01</span>Click the Stash icon to open the panel</li>
      <li><span class="num">02</span>Pin it so it’s always one click away</li>
      <li><span class="num">03</span><span>Want a different shortcut? <button id="change" type="button" class="btn link-btn">Change it</button></span></li>
    </ol>

    <div class="shortcut">
      <div class="lbl">Open panel —<br>Works on any page</div>
      <div id="keys" class="keys" aria-live="polite"></div>
    </div>

    <a id="ready" class="btn lg solid" href="home.html" style="margin-top:auto">I'm ready</a>
  </main>
  <script type="module" src="tip.js"></script>
</body>
</html>
