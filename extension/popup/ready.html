<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Stash — All sorted</title>
  <link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/forms.css"><link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="onboarding.css">
</head>
<body class="panel sky">
  <header id="head"></header>
  <main class="panel-body onboard">
    <div class="steps" role="img" aria-label="Step 3 of 4"><i class="done"></i><i class="done"></i><i class="on"></i><i></i></div>
    <h1 id="h1" style="margin-top:8px">All sorted</h1>
    <div id="stats" class="stats3"></div>

    <ul id="folders" class="folders" aria-live="polite"></ul>
    <button id="all" type="button" class="btn link-btn seeall" hidden></button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="actions">
      <button id="ok" type="button" class="btn lg solid grow">Looks good</button>
      <button id="change" type="button" class="btn lg outline">Change</button>
    </div>
  </main>
  <script type="module" src="ready.js"></script>
</body>
</html>
